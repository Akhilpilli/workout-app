<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Strength Log</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{color-scheme:dark;--bg:#101010;--card:#191919;--raised:#202020;--line:#303030;--text:#f3eee5;--muted:#a39d96;--accent:#ed743c;--gold:#e6b843;--green:#83c59b}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(26px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
    button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(16,16,16,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}.top-inner{max-width:760px;margin:auto;display:flex;gap:8px;align-items:center}.nav-btn{flex:1;min-height:46px;border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--muted);font-weight:700}.nav-btn[aria-selected=true]{color:#fff;background:var(--accent);border-color:var(--accent)}.history-icon{flex:0 0 48px;width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;display:grid;place-items:center}.history-icon svg{width:21px;height:21px;display:block}
    main{max-width:760px;margin:auto;padding:22px 16px}.eyebrow{color:var(--accent);font-weight:750;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.headline{font:400 clamp(30px,7vw,42px)/1.08 Georgia,serif;margin:4px 0 8px}.intro{color:var(--muted);margin:0 0 18px}.day-tabs{position:sticky;top:calc(68px + env(safe-area-inset-top));z-index:10;display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;margin:0 -2px 14px;background:linear-gradient(var(--bg) 80%,transparent);scrollbar-width:none}.day-tabs::-webkit-scrollbar{display:none}.day-btn{flex:0 0 auto;min-width:76px;text-align:left;padding:9px 13px;border:1px solid var(--line);border-radius:15px;background:var(--bg);color:var(--muted)}.day-btn strong{display:block;color:inherit}.day-btn small{font-size:12px}.day-btn[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:white}
    .session-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:8px 0 14px}.session-head h2{font:400 clamp(28px,6.3vw,38px)/1.1 Georgia,serif;margin:0}.session-meta,.panel,.exercise{border:1px solid var(--line);border-radius:18px;background:var(--card)}.session-meta{padding:14px 16px;margin:0 0 12px;font-weight:650}.panel{padding:16px;margin:12px 0}.panel h3{margin:0 0 6px;color:var(--gold);font-size:16px}.panel p{margin:0;color:var(--text)}
    .exercise{margin:11px 0;overflow:hidden}.exercise summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.exercise summary::-webkit-details-marker{display:none}.exercise summary:after{content:"+";font-size:24px;line-height:1;color:var(--muted)}.exercise[open] summary:after{content:"−"}.ex-title{font:400 22px/1.18 Georgia,serif}.ex-prescription{color:var(--muted);font-size:14px;margin-top:3px}.cue{display:inline-block;margin-top:8px;padding:3px 10px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-size:13px;line-height:1.4}.exercise-body{padding:0 16px 16px}.last-badge{display:flex;align-items:center;gap:8px;color:var(--green);background:rgba(131,197,155,.09);border-radius:10px;padding:9px 11px;font-size:13px;margin:0 0 13px}.last-badge.empty{color:var(--muted);background:var(--raised)}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select,.name-input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:#111;color:var(--text);padding:9px 10px;font-size:16px}.field input[type=number]{appearance:textfield}.field input::-webkit-inner-spin-button{opacity:1}.notes{margin-top:10px}.custom-row{padding:13px 14px;border:1px dashed #57504a;border-radius:14px;margin:10px 0}.custom-top{display:flex;gap:8px;align-items:center;margin-bottom:10px}.name-input{flex:1}.remove-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;min-height:44px;padding:0 12px}.actions{display:flex;gap:9px;margin:18px 0 26px}.primary,.secondary{min-height:52px;border-radius:14px;padding:11px 14px;font-weight:750}.primary{flex:1;background:var(--accent);border:1px solid var(--accent);color:#fff}.secondary{background:var(--card);border:1px solid var(--line);color:var(--text)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 10px}.section-title h3{font:400 25px Georgia,serif;margin:0}.history{max-height:420px;overflow:auto}.history-item{padding:12px;border-bottom:1px solid var(--line)}.history-item:last-child{border:0}.history-item strong{display:block}.history-item p{margin:4px 0 0;color:var(--muted);font-size:13px}.small-btn{min-height:42px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 11px;border-radius:12px}.footer-tools{border-top:1px solid var(--line);margin-top:32px;padding:20px 0 0}.tool-row{display:flex;flex-wrap:wrap;gap:8px}.file-label{display:inline-flex;align-items:center;min-height:42px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:12px;cursor:pointer}.file-label input{display:none}.status{min-height:24px;color:var(--green);font-size:13px;margin-top:9px}.empty-card{text-align:center;padding:42px 20px}.empty-card h2{font:400 32px Georgia,serif;margin:0 0 8px}.empty-card p{color:var(--muted);margin:0}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,140%);opacity:0;transition:.22s;z-index:30;background:#25382b;color:#d5f0dd;padding:12px 18px;border-radius:99px;box-shadow:0 8px 30px #0008}.toast.show{transform:translate(-50%,0);opacity:1}
    .set-row{align-items:end;margin:8px 0}.set-row .field label{min-height:18px}.set-remove{min-height:48px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);padding:0 10px}.set-tools{display:flex;justify-content:flex-end;margin-top:10px}
    .timer-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:14px 16px;margin:12px 0}.timer-panel strong{display:block}.timer-panel #timerStatus{color:var(--muted);font-size:14px}.timer-panel .primary,.timer-panel .secondary{flex:0 0 auto;min-height:46px}.history-date{font-size:14px;color:var(--gold);margin:20px 0 3px}.history-date:first-child{margin-top:0}dialog{width:min(440px,calc(100% - 28px));border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);padding:20px;box-shadow:0 20px 70px #000a}dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}dialog h2{font:400 27px Georgia,serif;margin:0 0 14px}dialog .field{margin:12px 0}dialog .dialog-actions{display:flex;gap:9px;margin-top:18px}.dialog-actions button{flex:1}.dialog-copy{color:var(--muted);font-size:14px;margin:-8px 0 14px}
    @media(min-width:620px){main{padding:28px 22px}.fields{gap:12px}.exercise summary{padding:17px 19px}.exercise-body{padding:0 19px 19px}}
  </style>
</head>
<body>
  <header class="topbar"><nav class="top-inner" aria-label="Main navigation"><button class="nav-btn" id="strengthNav" aria-selected="true">Strength</button><button class="nav-btn" id="runNav" aria-selected="false">Run</button><button class="nav-btn history-icon" id="historyNav" aria-label="History" title="History" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button></nav></header>
  <main id="app"></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="extraDialog" aria-labelledby="extraTitle"><form id="extraForm"><h2 id="extraTitle">Add an exercise</h2><p class="dialog-copy">Choose how you want to record this exercise.</p><div class="field"><label for="extraName">Exercise name</label><input id="extraName" maxlength="80" required autocomplete="off" placeholder="e.g. Cable lateral raise"></div><div class="field"><label for="extraType">Exercise type</label><select id="extraType"><option value="weight">Weight and reps</option><option value="reps">Reps only</option><option value="time">Time (seconds)</option></select></div><div class="dialog-actions"><button class="secondary" type="button" onclick="document.getElementById('extraDialog').close()">Cancel</button><button class="primary" type="submit">Add exercise</button></div></form></dialog>
  <script>
  (function(){'use strict';
    const KEY='strength-log-v1', VERSION=2;
    const WU='Dynamic warm-up, 7–8 min before every lift: neck circles, shoulder rolls, arm swings, wrist circles, hip circles, leg swings (front/back and side/side), ankle circles + 15 calf pulses, 3 slow inchworms.';
    const days=[
      {id:'MON',label:'Push',title:'Heavy push + upper abs',meta:'Gym 4:30–5:40 PM · about 70 min',ex:[
        ['Diamond push-ups','1 × 20','Bodyweight, always first','reps','Inner chest, tricep long head','Narrow hands load inner chest and triceps.'],['Feet-elevated push-ups','1 × 10–15','Bodyweight','reps','Upper chest, front delts','Raising the feet shifts load toward the upper chest.'],['Plate push-ups, then regular','1 × 5–10 + 5–10','45 lb plate on upper back, then drop it','reps','Mid chest, triceps','Plate flat across the upper back. If it slides, stop and reset.'],['Incline DB press','3 × 8–12','Start 40 lbs each hand','weight','Upper chest','Take 50 only if set 3 stays clean when filmed.'],['DB shoulder press','3 × 8–12','25 lbs each hand','weight','Front and side delts','Press smoothly without arching your back.'],['Dips','2 × 12–15','Bodyweight','reps','Lower chest, triceps','Keep shoulders controlled at the bottom.'],['Tricep pushdown','3 × 12','Cable, 25–30 lbs','weight','Lateral and medial tricep heads','Pin elbows to your sides.'],['Serratus reach','2 × 12','Cable, 10–12 lbs','weight','Serratus anterior','Keep arm straight; move the shoulder blade.'],['Cable crunch (upper abs)','3 × 12–15','25–30 lbs','weight','Upper rectus abdominis','Round the spine while hips stay put.'],['Plank','3 × 30–45 sec','Bodyweight','time','Deep core, obliques','Build anti-extension strength.']]},
      {id:'TUE',label:'Pull',title:'Heavy pull',meta:'Gym 4:30–5:45 PM',ex:[
        ['Max-effort pull-ups','3 × max, 90 sec rest','Bodyweight · log reps','reps','Lats, biceps, rear delts','Test fresh. Track reps for all three sets.'],['Dead hang','3 × 20–30 sec','Bodyweight','time','Grip, shoulder decompression','Do right after pull-ups.'],['Negative pull-ups','3 × 3','5 sec down, bodyweight','reps','Lats, biceps, rear delts','Lower slowly and stop short of failure.'],['Cable lat pulldown','3 × 8–12','Start ~80 lbs','weight','Lats, teres major','Choose a load leaving 1–2 reps in reserve.'],['Single-arm DB row','3 × 10–12 each side','Bench support','weight','Mid and upper back, rhomboids','Keep your torso supported.'],['Straight-arm pulldown','2 × 12','Cable, light','weight','Lat width','Keep arms straight and shoulders down.'],['Face pull','2 × 15','Cable, 15 lbs','weight','Rear delts, rotator cuff','Skip if the left rear shoulder aches.'],['DB bicep curl','3 × 12','Weight for 12 clean reps','weight','Biceps','Full stretch to squeeze; avoid swinging.']]},
      {id:'WED',label:'Legs',title:'Heavy legs + lower abs',meta:'Gym 4:30–5:30 PM · about 65 min',note:'No Bulgarian split squats or heavy lunges today. They cause deep soreness before the next run.',ex:[
        ['Bodyweight squats','3 × 25–30','Bodyweight, steady pace','reps','Quads, glutes','Smooth reps; stop before form breaks.'],['Smith machine squat','2 × 8–10','Your current load, stop 2 reps short','weight','Quads, glutes','Leave 2 reps in the tank on every set.'],['Romanian deadlift','3 × 10','40–45 lbs each hand','weight','Hamstrings, glutes','Hinge at the hips with a steady back.'],['Single-leg balance hold','3 × 30 sec each leg','Bodyweight','time','Glute medius, ankle stabilizers','Keep hips level.'],['Leg press calf raise','3 × 15','50–65 lbs','weight','Calves','Use the balls of feet at the platform edge.'],['Hanging knee raise (lower abs)','3 × 10–15','Bodyweight','reps','Lower abs, grip','Lift hips under the hang; avoid swinging.'],['Reverse crunch','2 × 12','Bodyweight','reps','Lower abs','Curl pelvis up.']]},
      {id:'THU',label:'Light Push',title:'Light push',meta:'Gym 4:30–5:10 PM · about 40 min',ex:[
        ['Diamond push-ups','1 × 20','Bodyweight, always first','reps','Inner chest, tricep long head','Same push-up trio as Monday.'],['Feet-elevated push-ups','1 × 10–15','Bodyweight','reps','Upper chest, front delts','Feet up shifts load to upper chest.'],['Plate push-ups, then regular','1 × 5–10 + 5–10','45 lb plate, then drop it','reps','Mid chest, triceps','Light day: stop 2 reps short on every set.'],['DB lateral raise','3 × 12–15','12–13 lbs each hand','weight','Side delts','Raise with control, no momentum.'],['Overhead tricep extension','2 × 12','Two hands on one DB','weight','Tricep long head','Keep elbows steady.']]},
      {id:'FRI',label:'Core',title:'Light + obliques and deep core',meta:'Gym 4:30–5:10 PM · about 40 min',note:'Keep cable woodchops light.',ex:[
        ['Dead hang','3 × 30 sec','Bodyweight','time','Grip, shoulders','Easy recovery loading.'],['TRX row','2 × 12','Bodyweight','reps','Mid back, rear delts','Pull without tiring the legs.'],['Pallof press','3 × 10 each side','Cable, light','weight','Obliques, anti-rotation','Resist rotation; keep torso still.'],['Side plank','3 × 30 sec each side','Bodyweight','time','Obliques, glute medius','Keep hips lifted and stacked.'],['Dead bug','2 × 10 each side','Bodyweight','reps','Deep core','Keep your core steady as limbs move.'],['Cable woodchop','2 × 12 each side','Cable, light','weight','Obliques','Use a light load.']]}
    ];
    // Keep these IDs attached to their exercises when changing names or order; use new IDs only for new exercises.
    const EXERCISE_IDS={MON:['plan:MON:0','plan:MON:1','plan:MON:2','plan:MON:3','plan:MON:4','plan:MON:5','plan:MON:6','plan:MON:7','plan:MON:8','plan:MON:9'],TUE:['plan:TUE:0','plan:TUE:1','plan:TUE:2','plan:TUE:3','plan:TUE:4','plan:TUE:5','plan:TUE:6','plan:TUE:7'],WED:['plan:WED:0','plan:WED:1','plan:WED:2','plan:WED:3','plan:WED:4','plan:WED:5','plan:WED:6'],THU:['plan:THU:0','plan:THU:1','plan:THU:2','plan:THU:3','plan:THU:4'],FRI:['plan:FRI:0','plan:FRI:1','plan:FRI:2','plan:FRI:3','plan:FRI:4','plan:FRI:5']};
    let app=document.getElementById('app'), state={version:VERSION,sessions:[],runSessions:[],extras:{},activeStrengthSessionId:null}, dayIndex=0, page='strength', storageOK=true;
    const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function safeRead(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const parsed=JSON.parse(raw),upgraded=migrateData(parsed);if(upgraded){state=upgraded;if(parsed.version!==VERSION||parsed.runSessions===undefined||parsed.activeStrengthSessionId===undefined||parsed.sessions.some(s=>s.entries.some(e=>!e.exerciseId)))safeWrite();}else announce('Saved data could not be read. Starting with an empty log.');}catch(e){storageOK=false;announce('Local storage is unavailable. Your current session can still be exported.');}}
    function safeWrite(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;return true;}catch(e){storageOK=false;announce('Could not save locally. Export your data to keep a backup.');return false;}}
    function validData(x){if(!x||![1,VERSION].includes(x.version)||!Array.isArray(x.sessions)||typeof x.extras!=='object'||!x.extras||Array.isArray(x.extras)||(x.runSessions!==undefined&&(!Array.isArray(x.runSessions)||!x.runSessions.every(s=>s&&typeof (s.savedAt||s.startedAt)==='string'&&(!s.endedAt||typeof s.endedAt==='string')))))return false;return x.sessions.every(s=>s&&typeof s.id==='string'&&typeof s.day==='string'&&days.some(d=>d.id===s.day)&&typeof (s.savedAt||s.startedAt)==='string'&&(!s.date||/^\d{4}-\d{2}-\d{2}$/.test(s.date))&&(!s.startedAt||typeof s.startedAt==='string')&&(!s.endedAt||typeof s.endedAt==='string')&&Array.isArray(s.entries)&&s.entries.every(e=>e&&typeof e.name==='string'&&['reps','weight','time'].includes(e.type)&&Array.isArray(e.sets)&&e.sets.length<=30&&e.sets.every(z=>z&&['number','string'].includes(typeof z.reps)&&['number','string'].includes(typeof z.weight)&&['number','string'].includes(typeof z.time))))&&Object.keys(x.extras).every(k=>days.some(d=>d.id===k)&&Array.isArray(x.extras[k])&&x.extras[k].length<=30&&x.extras[k].every(e=>e&&typeof e.name==='string'&&['reps','weight','time'].includes(e.type)));}
    function exerciseIdFor(day,name,isExtra){if(isExtra)return 'extra:'+day+':'+name.toLowerCase();const d=days.find(x=>x.id===day),idx=d?d.ex.findIndex(e=>e[0]===name):-1;return idx>=0?(EXERCISE_IDS[day][idx]||'plan:'+day+':'+idx):'extra:'+day+':'+name.toLowerCase();}
    function migrateData(x){if(!validData(x))return null;const upgraded=Object.assign({version:VERSION,sessions:[],runSessions:[],extras:{},activeStrengthSessionId:null},x,{version:VERSION});upgraded.sessions.forEach(s=>s.entries.forEach(e=>{if(!e.exerciseId)e.exerciseId=exerciseIdFor(s.day,e.name,!days.find(d=>d.id===s.day).ex.some(item=>item[0]===e.name));}));if(typeof upgraded.activeStrengthSessionId!=='string'||!upgraded.sessions.some(s=>s.id===upgraded.activeStrengthSessionId&&s.startedAt&&!s.endedAt))upgraded.activeStrengthSessionId=null;return upgraded;}
    function announce(msg){let t=document.getElementById('toast');if(t){t.textContent=msg;t.classList.add('show');clearTimeout(announce.timer);announce.timer=setTimeout(()=>t.classList.remove('show'),2600);}}
    function previous(day,name,exerciseId){return state.sessions.filter(s=>s.day===day).slice().reverse().flatMap(s=>s.entries).find(e=>e.exerciseId===exerciseId||(!e.exerciseId&&e.name===name))||null;}
    function bestFor(day,name,type,exerciseId){const entries=state.sessions.filter(s=>s.day===day).flatMap(s=>s.entries).filter(e=>(e.exerciseId===exerciseId||(!e.exerciseId&&e.name===name))&&e.type===type);let best=null,bestScore=-1;entries.forEach(e=>e.sets.forEach(set=>{const value=Number(type==='time'?set.time:type==='weight'?set.weight:set.reps);if(Number.isFinite(value)&&value>bestScore){bestScore=value;best=set;}}));if(!best)return '';return type==='time'?'Best: '+best.time+' sec':type==='weight'?'Best: '+best.weight+' lb × '+best.reps+' reps':'Best: '+best.reps+' reps';}
    function field(label,value,attrs){return '<div class="field"><label>'+label+'</label><input type="number" inputmode="decimal" min="0" step="any" value="'+esc(value)+'" '+attrs+'></div>';}
    function exerciseCard(ex,idx,isExtra){const [name,prescription,cue,type,target,why]=ex;const exerciseId=exerciseIdFor(days[dayIndex].id,name,isExtra);const prev=previous(days[dayIndex].id,name,exerciseId);const last=prev?'Last: '+prev.sets.map(s=>type==='time'?s.time+'s':type==='weight'?s.weight+' lb × '+s.reps:s.reps+' reps').join(' · '):'No previous log · Suggested: '+cue;const best=bestFor(days[dayIndex].id,name,type,exerciseId);const badge=last+(best?'  ·  '+best:'');let rows='';let count=prev?prev.sets.length:1;count=Math.min(Math.max(count,1),30);for(let j=0;j<count;j++){const p=prev&&prev.sets[j]||{};rows+='<div class="set-row fields"><div class="field"><label>Set '+(j+1)+(type==='time'?' · seconds':' · reps')+'</label><input type="number" inputmode="decimal" min="0" step="any" data-value="'+(type==='time'?'time':'reps')+'" value="'+esc(p[type==='time'?'time':'reps']??'')+'" placeholder="'+(type==='time'?'sec':'reps')+'"></div>'+(type==='weight'?'<div class="field"><label>Weight (lb)</label><input type="number" inputmode="decimal" min="0" step="any" data-value="weight" value="'+esc(p.weight??'')+'" placeholder="lb"></div>':'')+'<button class="set-remove" type="button" data-remove-set aria-label="Remove set '+(j+1)+'">Remove</button></div>';}
      return '<details class="exercise" data-exercise data-exercise-id="'+esc(exerciseId)+'" data-name="'+esc(name)+'" data-type="'+type+'" '+(isExtra?'open':'')+'><summary><div><div class="ex-title">'+esc(name)+'</div><div class="ex-prescription">'+esc(prescription)+'</div><span class="cue">'+esc(cue)+'</span></div></summary><div class="exercise-body"><div class="last-badge '+(prev?'':'empty')+'">'+esc(badge)+'</div><div class="sets">'+rows+'</div><div class="set-tools"><button class="small-btn" type="button" data-add-set>＋ Add set</button></div>'+(isExtra?'<button class="remove-btn" type="button" data-remove>Remove exercise</button>':'')+'</div></details>';
    }
    function render(){const s=document.getElementById('strengthNav'),r=document.getElementById('runNav'),hnav=document.getElementById('historyNav');s.setAttribute('aria-selected',page==='strength');r.setAttribute('aria-selected',page==='run');hnav.setAttribute('aria-selected',page==='history');if(page==='run'){app.innerHTML='<section class="panel empty-card"><div class="eyebrow">Run</div><h2>Coming soon</h2><p>Run sessions will be tracked separately from strength workouts.</p></section>';return;}if(page==='history'){renderHistory();return;}const d=days[dayIndex],active=getActiveStrengthSession(),today=localDate();let timerText=active?'Active strength session · '+esc(dayName(active.day))+' · <span id="elapsedTimer">00:00:00</span>':'No strength timer running';let timerButton=active?'<button class="primary" id="toggleTimer" type="button">Stop workout</button>':'<button class="secondary" id="toggleTimer" type="button">Start workout</button>';let html='<div class="eyebrow">Strength log</div><h1 class="headline">Build strength, week by week.</h1><p class="intro">Your plan, your history, saved on this device.</p><div class="day-tabs" role="tablist" aria-label="Workout days">';days.forEach((day,i)=>html+='<button class="day-btn" role="tab" aria-selected="'+(i===dayIndex)+'" data-day="'+i+'"><strong>'+day.id+'</strong><small>'+esc(day.label)+'</small></button>');html+='</div><section><div class="session-head"><h2>'+esc(d.title)+'</h2></div><div class="session-meta">'+esc(d.meta)+'</div><div class="timer-panel"><div><strong>Workout timer</strong><div id="timerStatus">'+timerText+'</div></div>'+timerButton+'</div><div class="panel"><h3>Warm-up</h3><p>'+esc(WU)+'</p></div><div id="exerciseList">';d.ex.forEach((ex,i)=>html+=exerciseCard(ex,i,false));(state.extras[d.id]||[]).forEach((ex,i)=>html+=exerciseCard([ex.name,ex.prescription||'Custom exercise',ex.cue||'Custom exercise',ex.type,'',''],i,true));html+='</div><button class="secondary" id="addExtra" type="button">＋ Add extra exercise</button>'+(d.note?'<div class="panel"><h3>Plan note</h3><p>'+esc(d.note)+'</p></div>':'')+'<div class="actions"><button class="primary" id="saveSession" type="button">Save / Complete Workout</button></div></section><footer class="footer-tools"><div class="section-title"><h3>Data & backup</h3></div><div class="tool-row"><button class="small-btn" id="exportData" type="button">Export JSON</button><label class="file-label">Import JSON<input type="file" id="importData" accept="application/json,.json"></label></div><div class="status" id="storageStatus">'+(storageOK?'Saved on this device':'Storage unavailable · export for backup')+'</div></footer>';
      app.innerHTML=html;app.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{dayIndex=Number(b.dataset.day);render();window.scrollTo({top:0,behavior:'smooth'});}));document.getElementById('addExtra').addEventListener('click',openExtraDialog);document.getElementById('saveSession').addEventListener('click',saveSession);document.getElementById('toggleTimer').addEventListener('click',toggleStrengthTimer);document.getElementById('exportData').addEventListener('click',exportData);document.getElementById('importData').addEventListener('change',importData);app.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',removeExtra));app.querySelectorAll('[data-add-set]').forEach(b=>b.addEventListener('click',addSet));app.querySelectorAll('[data-remove-set]').forEach(b=>b.addEventListener('click',removeSet));updateElapsed();}
    function renderHistory(){const workouts=state.sessions.slice().sort((a,b)=>new Date(b.startedAt||b.savedAt)-new Date(a.startedAt||a.savedAt));const runs=(state.runSessions||[]).slice().sort((a,b)=>new Date(b.startedAt||b.savedAt)-new Date(a.startedAt||a.savedAt));const group=(items,kind)=>{if(!items.length)return '<div class="panel"><p style="color:var(--muted);margin:0">No '+kind.toLowerCase()+' sessions recorded yet.</p></div>';let html='',last='';items.forEach(s=>{const date=s.date||localDate(new Date(s.startedAt||s.savedAt));if(date!==last){last=date;html+='<h3 class="history-date">'+esc(formatDate(date))+'</h3>';}const day=kind==='Workouts'?dayName(s.day):'Run';const start=s.startedAt?formatTime(s.startedAt):'Time not recorded';const end=s.endedAt?' – '+formatTime(s.endedAt):s.startedAt?' – In progress':'';const elapsed=s.startedAt&&s.endedAt?' · '+formatDuration(new Date(s.endedAt)-new Date(s.startedAt)):'';const details=(s.entries||[]).map(e=>esc(e.name)+': '+e.sets.map(z=>e.type==='time'?esc(z.time)+' sec':e.type==='weight'?esc(z.weight)+' lb × '+esc(z.reps):esc(z.reps)+' reps').join(', ')).join(' · ');html+='<article class="history-item"><strong>'+esc(day)+' · '+start+end+elapsed+'</strong><p>'+esc(details|| (s.endedAt?'Session timer recorded':'Session in progress'))+'</p></article>';});return html;};app.innerHTML='<div class="eyebrow">Your log</div><h1 class="headline">History</h1><p class="intro">Workout and run sessions, newest first.</p><section><div class="section-title"><h3>Workouts</h3></div>'+group(workouts,'Workouts')+'</section><section><div class="section-title"><h3>Runs</h3></div>'+group(runs,'Runs')+'</section><footer class="footer-tools"><div class="tool-row"><button class="small-btn" id="exportData" type="button">Export JSON</button><label class="file-label">Import JSON<input type="file" id="importData" accept="application/json,.json"></label></div><div class="status">'+(storageOK?'Saved on this device':'Storage unavailable · export for backup')+'</div></footer>';document.getElementById('exportData').addEventListener('click',exportData);document.getElementById('importData').addEventListener('change',importData);}
    function openExtraDialog(){const dlg=document.getElementById('extraDialog');dlg.showModal();document.getElementById('extraName').focus();}
    document.getElementById('extraForm').addEventListener('submit',function(ev){ev.preventDefault();const form=ev.currentTarget,name=document.getElementById('extraName').value.trim(),type=document.getElementById('extraType').value;if(!name){announce('Enter an exercise name.');return;}const d=days[dayIndex],item={name:name.slice(0,80),type:type,prescription:type==='time'?'Custom · time-based':'Custom · reps and weight',cue:type==='time'?'Track time in seconds':'Track reps and weight'};state.extras[d.id]=state.extras[d.id]||[];state.extras[d.id].push(item);safeWrite();document.getElementById('extraDialog').close();form.reset();render();const cards=app.querySelectorAll('[data-exercise]');if(cards.length)cards[cards.length-1].scrollIntoView({behavior:'smooth',block:'center'});});
    function removeExtra(ev){const card=ev.target.closest('[data-exercise]'),name=card.dataset.name,d=days[dayIndex];if(!confirm('Remove '+name+' from this day?'))return;state.extras[d.id]=(state.extras[d.id]||[]).filter(e=>e.name!==name);safeWrite();render();}
    function addSet(ev){const card=ev.target.closest('[data-exercise]'),rows=card.querySelector('.sets'),type=card.dataset.type,count=rows.querySelectorAll('.set-row').length;if(count>=30){announce('An exercise can have up to 30 sets.');return;}const n=count+1,row=document.createElement('div');row.className='set-row fields';row.innerHTML='<div class="field"><label>Set '+n+(type==='time'?' · seconds':' · reps')+'</label><input type="number" inputmode="decimal" min="0" step="any" data-value="'+(type==='time'?'time':'reps')+'" placeholder="'+(type==='time'?'sec':'reps')+'"></div>'+(type==='weight'?'<div class="field"><label>Weight (lb)</label><input type="number" inputmode="decimal" min="0" step="any" data-value="weight" placeholder="lb"></div>':'')+'<button class="set-remove" type="button" data-remove-set aria-label="Remove set '+n+'">Remove</button>';rows.appendChild(row);row.querySelector('[data-remove-set]').addEventListener('click',removeSet);row.querySelector('input').focus();}
    function removeSet(ev){const card=ev.target.closest('[data-exercise]'),rows=card.querySelector('.sets');if(rows.children.length<=1){announce('Keep at least one set.');return;}ev.target.closest('.set-row').remove();Array.from(rows.children).forEach((row,i)=>{row.querySelector('label').textContent='Set '+(i+1)+(card.dataset.type==='time'?' · seconds':' · reps');row.querySelector('[data-remove-set]').setAttribute('aria-label','Remove set '+(i+1));});}
    function localDate(d){d=d||new Date();const shifted=new Date(d.getTime()-d.getTimezoneOffset()*60000);return shifted.toISOString().slice(0,10);}
    function dayName(id){const d=days.find(x=>x.id===id);return d?d.id+' · '+d.label:id||'Workout';}
    function formatTime(iso){return new Date(iso).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
    function formatDate(date){return new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});}
    function formatDuration(ms){const n=Math.max(0,Math.floor(ms/1000)),h=String(Math.floor(n/3600)).padStart(2,'0'),m=String(Math.floor(n%3600/60)).padStart(2,'0'),s=String(n%60).padStart(2,'0');return h+':'+m+':'+s;}
    function getActiveStrengthSession(){return state.sessions.find(s=>s.id===state.activeStrengthSessionId&&!s.endedAt)||null;}
    function updateElapsed(){const el=document.getElementById('elapsedTimer'),session=getActiveStrengthSession();if(el&&session)el.textContent=formatDuration(Date.now()-new Date(session.startedAt).getTime());}
    function toggleStrengthTimer(){const active=getActiveStrengthSession();if(active){active.endedAt=new Date().toISOString();state.activeStrengthSessionId=null;if(safeWrite())announce('Workout timer stopped.');}else{const now=new Date(),id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);state.sessions.push({id:id,day:days[dayIndex].id,date:localDate(now),startedAt:now.toISOString(),endedAt:null,savedAt:now.toISOString(),entries:[]});state.activeStrengthSessionId=id;if(safeWrite())announce('Workout timer started.');}render();}
    function saveSession(){const entries=[];app.querySelectorAll('[data-exercise]').forEach(card=>{const sets=[];card.querySelectorAll('.set-row').forEach(row=>{const get=k=>row.querySelector('[data-value="'+k+'"]')?.value||'';const rep=get('reps'),wt=get('weight'),tm=get('time');if(rep||wt||tm)sets.push({reps:rep,weight:wt,time:tm});});if(sets.length)entries.push({name:card.dataset.name,exerciseId:card.dataset.exerciseId,type:card.dataset.type,sets});});if(!entries.length){announce('Add at least one set before saving.');return;}const today=localDate(),active=getActiveStrengthSession();let session=active&&active.day===days[dayIndex].id?active:state.sessions.filter(s=>s.day===days[dayIndex].id&&(s.date||localDate(new Date(s.startedAt||s.savedAt)))===today).slice(-1)[0];if(!session){const now=new Date();session={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),day:days[dayIndex].id,date:today,savedAt:now.toISOString(),startedAt:null,endedAt:null,entries:[]};state.sessions.push(session);}session.entries=entries;session.savedAt=new Date().toISOString();if(safeWrite()){announce('Workout saved. Nice work!');render();window.scrollTo({top:0,behavior:'smooth'});}}
    function exportData(){try{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='strength-log-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);announce('JSON backup downloaded.');}catch(e){announce('Export failed. Please try again.');}}
    function importData(ev){const file=ev.target.files&&ev.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const candidate=JSON.parse(String(reader.result)),upgraded=migrateData(candidate);if(!upgraded){announce('Import rejected: file has an invalid or unsupported format.');return;}if(!confirm('Replace this device’s workout data with the imported backup?'))return;state=upgraded;if(safeWrite()){announce('Backup imported successfully.');render();}}catch(e){announce('Import rejected: the file is not valid JSON.');}finally{ev.target.value='';}};reader.onerror=()=>announce('Could not read that file.');reader.readAsText(file);}
    document.getElementById('strengthNav').addEventListener('click',()=>{page='strength';render();});document.getElementById('runNav').addEventListener('click',()=>{page='run';render();});document.getElementById('historyNav').addEventListener('click',()=>{page='history';render();});safeRead();render();setInterval(updateElapsed,1000);
  })();
  </script>
